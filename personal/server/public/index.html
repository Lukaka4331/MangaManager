<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫畫管理系統 — COMIC STATION</title>
  
  <!-- 引入現代無襯線字體與高品質 Icon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ============ 現代極簡變數設定 ============ */
    :root {
      --bg-main: #090a0f;
      --bg-card: rgba(17, 19, 28, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --accent-color: #6366f1; /* 俐落的冷調靛藍，取代高飽和紫 */
      --accent-hover: #4f46e5;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #10b981;
      
      --font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ============ 全域重設 ============ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      /* 背景使用極微弱的暗色波紋，取代大面積亮紫色漸層 */
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(118, 75, 162, 0.03) 0px, transparent 50%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ============ 頁首設計 (現代精緻感) ============ */
    header {
      text-align: left; /* 改為左對齊，更有儀表板的專業感 */
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ============ Bento Grid 版面配置 ============ */
    .content {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 850px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    /* ============ 現代化卡片 (Glassmorphism) ============ */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      transition: var(--transition-smooth);
    }

    .card h2 {
      color: var(--text-primary);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .category-header h2 { margin-bottom: 0; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }

    .category-card {
      position: relative;
      display: flex;
      min-height: 118px;
      padding: 20px;
      align-items: flex-start;
      flex-direction: column;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      border-color: var(--border-color);
      background: rgba(255, 255, 255, 0.025);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .category-card:hover {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    .category-card-name { font-size: 1.1rem; font-weight: 600; }
    .category-card-count { color: var(--text-secondary); font-size: 0.8rem; }
    .back-category-btn { padding: 7px 11px; font-size: 0.8rem; }

    .category-delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 8px;
      font-size: 0.72rem;
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.08);
    }

    .category-delete-btn:hover {
      color: #fff;
      border-color: var(--danger-color);
      background: var(--danger-color);
    }

    /* ============ 精緻化輸入欄位 ============ */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
    }

    select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* ============ 無 AI 感的極簡上傳區 ============ */
    .upload-zone {
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition-smooth);
      background: rgba(255, 255, 255, 0.01);
    }

    .upload-zone:hover {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.02);
    }

    .upload-zone.dragover {
      border-color: var(--accent-color);
      background: rgba(99, 102, 241, 0.06);
      transform: scale(0.99); /* 現代反向縮小反饋，而非放大 */
    }

    .upload-zone svg {
      width: 32px;
      height: 32px;
      margin-bottom: 12px;
      stroke: var(--text-muted);
      transition: var(--transition-smooth);
    }

    .upload-zone:hover svg {
      stroke: var(--accent-color);
    }

    .upload-zone p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* ============ 現代化按鈕定義 ============ */
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      font-size: 0.875rem;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    .btn-primary {
      background: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    /* ============ 上傳預覽與進度條 ============ */
    .preview-section {
      margin-top: 18px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
    }

    .preview-item {
      aspect-ratio: 3/4;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-container {
      margin-top: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.1s linear;
    }

    /* ============ 數據儀表板樣式 ============ */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.02);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* 提示區塊 */
    .info-box {
      background: rgba(245, 158, 11, 0.03);
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(245, 158, 11, 0.15);
      margin-top: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .info-box p {
      color: #f59e0b;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    /* ============ 漫畫列表區塊 (俐落無邊框海報) ============ */
    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .comic-card {
      background: transparent;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition-smooth);
    }

    /* 模仿現代串流軟體的海報懸停放大 */
    .comic-card:hover .comic-thumbnail {
      transform: scale(1.02);
      border-color: var(--border-hover);
    }

    .comic-thumbnail {
      width: 100%;
      aspect-ratio: 3/4; /* 標準漫畫黃金比率 */
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .comic-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comic-info {
      padding: 10px 2px 0 2px;
    }

    .comic-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comic-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .comic-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    /* 使功能鍵更精簡小巧 */
    .comic-actions button {
      padding: 6px;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .btn-view {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .btn-view:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn-thumbnail {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .btn-thumbnail:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-delete {
      grid-column: span 2;
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: rgba(239, 68, 68, 0.7);
      margin-top: 2px;
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
    }

    /* 狀態空置 (Empty State) */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* ============ 現代毛玻璃彈出框 (Modal) ============ */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 6, 10, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #0f111a;
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      transform: scale(0.95);
      transition: var(--transition-smooth);
    }

    .modal.active .modal-content {
      transform: scale(1);
    }

    .modal-content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }

    .thumbnail-item {
      position: relative;
      aspect-ratio: 3/4;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: var(--transition-smooth);
    }

    .thumbnail-item:hover {
      border-color: var(--accent-color);
    }

    .thumbnail-item.selected {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    .thumbnail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-item-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      color: var(--text-primary);
      padding: 6px;
      font-size: 0.7rem;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    /* ============ 現代 Toast 提示盒 ============ */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #fff;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      z-index: 1000;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); color: #a7f3d0; }
    .toast.error { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); color: #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Comic Station</h1>
        <p>輕量化本地漫畫庫存管理</p>
      </div>
    </header>

    <!-- 首頁：先選擇分類，再瀏覽該分類的漫畫 -->
    <div class="card" style="margin-bottom: 20px;">
      <div id="categoryView">
        <div class="category-header">
          <h2>選擇想看的漫畫類別</h2>
          <button type="button" class="btn-secondary" id="createCategoryBtn">＋ 建立分類</button>
        </div>
        <div id="categoryGrid" class="category-grid"></div>
      </div>

      <div id="comicView" hidden>
        <div class="category-header">
          <div>
            <button type="button" class="btn-secondary back-category-btn" id="backToCategoriesBtn">← 所有分類</button>
            <h2 id="comicListTitle" style="margin-top: 14px;">漫畫</h2>
          </div>
          <button type="button" class="btn-primary" id="uploadToCategoryBtn">匯入至此分類</button>
        </div>
        <div id="comicListContainer">
          <div class="empty-state">
            <div class="empty-state-icon">📂</div>
            <p>請先選擇漫畫分類。</p>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- 左側：上傳區塊 -->
      <div class="card">
        <h2>上傳漫畫庫</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="comicName">漫畫名稱</label>
            <input type="text" id="comicName" name="name" placeholder="請輸入漫畫名稱..." required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="comicCategory">漫畫分類</label>
            <select id="comicCategory" name="categoryId">
              <option value="">未分類</option>
            </select>
          </div>

          <div class="form-group">
            <label>漫畫頁面檔案</label>
            <div class="upload-zone" id="uploadZone">
              <!-- 精緻的原生 SVG 向量 icon 取代 Emoji -->
              <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
              </svg>
              <p>點擊或將漫畫圖片拖拽至此處</p>
              <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">支援多圖大量匯入</p>
              <input type="file" id="imageInput" name="images" multiple accept="image/*" style="display: none;">
            </div>
          </div>

          <div id="preview" class="preview-section" style="display: none;">
            <p style="color: var(--text-secondary); margin-bottom: 8px; font-size: 0.8rem;">暫存預覽：</p>
            <div id="previewGrid" class="preview-grid"></div>
          </div>

          <div id="progressContainer" class="progress-container" style="display: none;">
            <p style="color: var(--text-secondary); font-size: 0.8rem; display: flex; justify-content: space-between;">
              <span>正在匯入資料庫...</span>
              <span><span id="progressPercent">0</span>%</span>
            </p>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-primary" id="uploadBtn">開始匯入</button>
            <button type="button" class="btn-secondary" id="resetBtn">清除</button>
          </div>
        </form>
      </div>

      <!-- 右側：統計資訊 -->
      <div class="card">
        <h2>庫存統計</h2>
        <div class="stats">
          <div class="stat-item">
            <div class="stat-number" id="totalComics">0</div>
            <div class="stat-label">總漫畫數</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="totalPages">0</div>
            <div class="stat-label">累積頁數</div>
          </div>
        </div>
        
        <button class="btn-primary" id="rescanBtn" style="width: 100%; margin-top: 15px;">同步/掃描伺服器目錄</button>
        
        <div class="info-box">
          <svg style="width: 16px; height: 16px; stroke: #f59e0b; flex-shrink: 0;" fill="none" viewBox="0 0 24 24" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          <p>點擊「同步/掃描伺服器目錄」可將放置於後端 uploads 目錄下的資料夾自動解析為漫畫冊。</p>
        </div>  
        
        <div class="info-box" style="margin-top: 10px;">
          <svg style="width: 16px; height: 16px; stroke: #f59e0b; flex-shrink: 0;" fill="none" viewBox="0 0 24 24" stroke-width="2" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          <p>你可以手動指定特定的漫畫內頁作為該書籍的封面縮圖。</p>
        </div>
      </div>
    </div>

  </div>

  <!-- 縮圖管理模態框 -->
  <div class="modal" id="thumbnailModal">
    <div class="modal-content">
      <h3>設定代表縮圖</h3>
      <p style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 15px;">
        選取書籍「<span id="modalComicName" style="color: var(--text-primary); font-weight: 500;"></span>」的其中一個頁面作為資料庫海報：
      </p>
      <div class="thumbnail-grid" id="pageGrid"></div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeThumbnailModal()">取消</button>
        <button class="btn-primary" id="confirmThumbnailBtn" style="display: none;" onclick="confirmThumbnail()">確定套用</button>
      </div>
    </div>
  </div>

  <!-- ============ 原生 JS 邏輯區 (完全保留，未修改任何功能邏輯與 DOM 操作) ============ -->
  <script>
    let selectedPageIndex = null;
    let currentEditingComic = null;
    let currentCategory = null;
    let categories = [];

    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const previewSection = document.getElementById('preview');
    const previewGrid = document.getElementById('previewGrid');
    const comicListContainer = document.getElementById('comicListContainer');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const totalComicsSpan = document.getElementById('totalComics');
    const totalPagesSpan = document.getElementById('totalPages');
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const rescanBtn = document.getElementById('rescanBtn');
    const thumbnailModal = document.getElementById('thumbnailModal');
    const modalComicName = document.getElementById('modalComicName');
    const pageGrid = document.getElementById('pageGrid');
    const confirmThumbnailBtn = document.getElementById('confirmThumbnailBtn');
    const comicCategorySelect = document.getElementById('comicCategory');
    const categoryView = document.getElementById('categoryView');
    const comicView = document.getElementById('comicView');
    const categoryGrid = document.getElementById('categoryGrid');
    const comicListTitle = document.getElementById('comicListTitle');
    const createCategoryBtn = document.getElementById('createCategoryBtn');
    const backToCategoriesBtn = document.getElementById('backToCategoriesBtn');
    const uploadToCategoryBtn = document.getElementById('uploadToCategoryBtn');

    // 拖拽
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      imageInput.files = e.dataTransfer.files;
      updatePreview();
    });

    uploadZone.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', updatePreview);

    createCategoryBtn.addEventListener('click', createCategory);
    backToCategoriesBtn.addEventListener('click', showCategories);
    uploadToCategoryBtn.addEventListener('click', () => {
      comicCategorySelect.value = currentCategory.id === 'uncategorized' ? '' : currentCategory.id;
      document.getElementById('comicName').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function updatePreview() {
      if (imageInput.files.length === 0) {
        previewSection.style.display = 'none';
        return;
      }

      previewSection.style.display = 'block';
      previewGrid.innerHTML = '';

      Array.from(imageInput.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          const img = document.createElement('img');
          img.src = e.target.result;
          div.appendChild(img);
          previewGrid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    resetBtn.addEventListener('click', () => {
      form.reset();
      previewSection.style.display = 'none';
      previewGrid.innerHTML = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const comicName = document.getElementById('comicName').value.trim();
      
      if (!comicName) {
        showToast('請輸入漫畫名稱', 'error');
        return;
      }

      if (imageInput.files.length === 0) {
        showToast('請選擇至少一張圖片', 'error');
        return;
      }

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      uploadBtn.textContent = '上傳中...';

      const formData = new FormData(form);
      
      try {
        const xhr = new XMLHttpRequest();
        
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const percentComplete = (e.loaded / e.total) * 100;
            progressFill.style.width = percentComplete + '%';
            progressPercent.textContent = Math.round(percentComplete);
          }
        });

        xhr.addEventListener('load', async () => {
          if (xhr.status === 201) {
            showToast('漫畫上傳成功！', 'success');
            form.reset();
            previewSection.style.display = 'none';
            previewGrid.innerHTML = '';
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0';
            await loadCategories();
            if (currentCategory) await loadComics(currentCategory);
          } else {
            const res = JSON.parse(xhr.responseText);
            showToast(res.message || '上傳失敗', 'error');
          }
          uploadBtn.disabled = false;
          uploadBtn.textContent = '開始匯入';
        });

        xhr.addEventListener('error', () => {
          showToast('上傳出錯，請重試', 'error');
          uploadBtn.disabled = false;
          uploadBtn.textContent = '開始匯入';
        });

        xhr.open('POST', '/uploadComic');
        xhr.send(formData);
      } catch (err) {
        console.error(err);
        showToast('上傳失敗', 'error');
        uploadBtn.disabled = false;
        uploadBtn.textContent = '開始匯入';
      }
    });
    
    rescanBtn.addEventListener('click', rescanComics);

    async function rescanComics() {
      rescanBtn.disabled = true;
      rescanBtn.textContent = '掃描中...';

      try {
        const res = await fetch('/rescanComics', { method: 'POST' });
        const msg = await res.json();
        
        showToast(msg.message, 'success');
        await loadCategories();
        if (currentCategory) await loadComics(currentCategory);
      } catch (err) {
        console.error(err);
        showToast('掃描失敗', 'error');
      } finally {
        rescanBtn.disabled = false;
        rescanBtn.textContent = '同步/掃描伺服器目錄';
      }
    }

    async function loadCategories() {
      try {
        const [categoriesRes, comicsRes] = await Promise.all([
          fetch('/categories'),
          fetch('/listComics')
        ]);
        if (!categoriesRes.ok || !comicsRes.ok) throw new Error('載入分類失敗');

        categories = await categoriesRes.json();
        const allComics = await comicsRes.json();
        totalComicsSpan.textContent = allComics.length;
        totalPagesSpan.textContent = allComics.reduce((sum, comic) => sum + comic.pageCount, 0);

        comicCategorySelect.innerHTML = '<option value="">未分類</option>';
        categoryGrid.innerHTML = '';

        categories.forEach(category => {
          if (category.id !== 'uncategorized') {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.name;
            comicCategorySelect.appendChild(option);
          }

          const card = document.createElement('div');
          card.className = 'category-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.innerHTML = `
            <span class="category-card-name">${escapeHtml(category.name)}</span>
            <span class="category-card-count">${category.comicCount} 本漫畫</span>
          `;
          card.addEventListener('click', () => openCategory(category));
          card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openCategory(category);
            }
          });

          if (category.id !== 'uncategorized' && !['KOR', 'JP', '3D'].includes(category.name)) {
            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'category-delete-btn';
            deleteButton.textContent = '刪除';
            deleteButton.addEventListener('click', event => {
              event.stopPropagation();
              deleteCategory(category);
            });
            card.appendChild(deleteButton);
          }

          categoryGrid.appendChild(card);
        });
      } catch (err) {
        console.error('載入分類失敗:', err);
        categoryGrid.innerHTML = '<p style="color: #ef4444;">分類載入失敗，請重新整理頁面。</p>';
      }
    }

    function openCategory(category) {
      currentCategory = category;
      categoryView.hidden = true;
      comicView.hidden = false;
      comicListTitle.textContent = `${category.name} 漫畫（${category.comicCount} 本）`;
      uploadToCategoryBtn.textContent = category.id === 'uncategorized' ? '匯入未分類漫畫' : `匯入至 ${category.name}`;
      loadComics(category);
    }

    function showCategories() {
      currentCategory = null;
      comicView.hidden = true;
      categoryView.hidden = false;
      loadCategories();
    }

    async function loadComics(category = currentCategory) {
      if (!category) return;
      try {
        const res = await fetch(`/listComics?categoryId=${encodeURIComponent(category.id)}`);
        if (!res.ok) throw new Error('載入漫畫失敗');
        const comics = await res.json();
        comicListTitle.textContent = `${category.name} 漫畫（${comics.length} 本）`;

        if (comics.length === 0) {
          comicListContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📂</div>
              <p>${escapeHtml(category.name)} 目前沒有漫畫，請由上方匯入。</p>
            </div>
          `;
          return;
        }

        comicListContainer.innerHTML = '';
        const comicGrid = document.createElement('div');
        comicGrid.className = 'comic-grid';

        comics.forEach((comic) => {
          const card = document.createElement('div');
          card.className = 'comic-card';
          
          const thumbnailHtml = comic.thumbnail 
            ? `<img src="${comic.thumbnail}" alt="${escapeHtml(comic.name)}">`
            : `<div style="font-size: 2rem; opacity: 0.3;">📖</div>`;

          const categoryOptions = [
            '<option value="">未分類</option>',
            ...categories.filter(item => item.id !== 'uncategorized').map(item =>
              `<option value="${item.id}" ${comic.category && comic.category.id === item.id ? 'selected' : ''}>${escapeHtml(item.name)}</option>`
            )
          ].join('');

          card.innerHTML = `
            <div class="comic-thumbnail">${thumbnailHtml}</div>
            <div class="comic-info">
              <div class="comic-name" title="${escapeHtml(comic.name)}">${escapeHtml(comic.name)}</div>
              <div class="comic-meta">${comic.pageCount} 頁 · ${escapeHtml(comic.category ? comic.category.name : '未分類')}</div>
              <select class="comic-category-select" aria-label="變更漫畫分類">${categoryOptions}</select>
              <div class="comic-actions">
                <button class="btn-view" onclick="viewComic('${encodeURIComponent(comic.name)}')">預覽</button>
                <button class="btn-thumbnail" onclick="openThumbnailModal('${encodeURIComponent(comic.name)}')">縮圖</button>
                <button class="btn-delete" onclick="deleteComic('${encodeURIComponent(comic.name)}')">刪除書籍</button>
              </div>
            </div>
          `;
          card.querySelector('.comic-category-select').addEventListener('change', event => {
            changeComicCategory(comic.id, event.target.value);
          });
          comicGrid.appendChild(card);
        });

        comicListContainer.appendChild(comicGrid);
      } catch (err) {
        console.error('載入漫畫列表失敗:', err);
        comicListContainer.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 20px;">資料庫連線失敗，請刷新重試。</p>';
      }
    }

    async function createCategory() {
      const name = prompt('請輸入新分類名稱：');
      if (name === null || !name.trim()) return;

      try {
        const res = await fetch('/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name.trim() })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '建立分類失敗');
        showToast(`已建立「${data.name}」`, 'success');
        await loadCategories();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteCategory(category) {
      if (!confirm(`確定要刪除分類「${category.name}」？`)) return;

      try {
        const res = await fetch(`/categories/${category.id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '刪除分類失敗');
        showToast(`已刪除「${category.name}」`, 'success');
        await loadCategories();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function changeComicCategory(comicId, categoryId) {
      try {
        const res = await fetch(`/comics/${comicId}/category`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ categoryId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '更新分類失敗');
        showToast('漫畫分類已更新', 'success');
        await loadCategories();
        if (currentCategory) await loadComics(currentCategory);
      } catch (err) {
        showToast(err.message, 'error');
        if (currentCategory) await loadComics(currentCategory);
      }
    }

    async function openThumbnailModal(encodedComicName) {
      const comicName = decodeURIComponent(encodedComicName);
      currentEditingComic = comicName;
      selectedPageIndex = null;

      modalComicName.textContent = comicName;
      confirmThumbnailBtn.style.display = 'none';

      try {
        const res = await fetch(`/getComic/${encodedComicName}`);
        const data = await res.json();

        pageGrid.innerHTML = '';
        data.pages.forEach((page, index) => {
          const div = document.createElement('div');
          div.className = 'thumbnail-item';
          div.innerHTML = `
            <img src="${page}" alt="第 ${index + 1} 頁">
            <div class="thumbnail-item-label">頁面 ${index + 1}</div>
          `;
          div.addEventListener('click', () => selectPage(index, div));
          pageGrid.appendChild(div);
        });

        thumbnailModal.style.display = 'flex';
        // 微小延遲以觸發 CSS 過渡動畫
        setTimeout(() => thumbnailModal.classList.add('active'), 10);
      } catch (err) {
        console.error(err);
        showToast('無法加載漫畫頁面', 'error');
      }
    }

    function selectPage(index, element) {
      document.querySelectorAll('.thumbnail-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      selectedPageIndex = index;
      element.classList.add('selected');
      confirmThumbnailBtn.style.display = 'block';
    }

    async function confirmThumbnail() {
      if (!currentEditingComic || selectedPageIndex === null) return;

      confirmThumbnailBtn.disabled = true;
      confirmThumbnailBtn.textContent = '處理中...';

      try {
        const res = await fetch(`/setThumbnailPage/${encodeURIComponent(currentEditingComic)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageIndex: selectedPageIndex })
        });

        if (!res.ok) throw new Error('設置失敗');
        showToast('縮圖已成功套用！', 'success');

        closeThumbnailModal();
        await loadComics();
      } catch (err) {
        console.error(err);
        showToast('操作失敗', 'error');
      } finally {
        confirmThumbnailBtn.disabled = false;
        confirmThumbnailBtn.textContent = '確定套用';
      }
    }

    function closeThumbnailModal() {
      thumbnailModal.classList.remove('active');
      setTimeout(() => thumbnailModal.style.display = 'none', 250);
      selectedPageIndex = null;
      currentEditingComic = null;
    }

    function viewComic(encodedName) {
      window.open(`/viewer.html?name=${encodedName}`, '_blank');
    }

    async function deleteComic(encodedName) {
      const name = decodeURIComponent(encodedName);
      if (!confirm(`確定要刪除漫畫 "${name}"？此操作無法撤銷。`)) {
        return;
      }

      try {
        const res = await fetch(`/deleteComic/${encodedName}`, { method: 'DELETE' });
        const msg = await res.json();
        
        if (res.ok) {
          showToast(`已刪除 "${name}"`, 'success');
          await loadCategories();
          if (currentCategory) await loadComics(currentCategory);
        } else {
          showToast(msg.message || '刪除失敗', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('刪除出錯', 'error');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, type = 'success') {
      const existingToast = document.querySelector('.toast');
      if (existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      // 動態加入顯示 class
      setTimeout(() => toast.classList.add('show'), 50);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    thumbnailModal.addEventListener('click', (e) => {
      if (e.target === thumbnailModal) {
        closeThumbnailModal();
      }
    });

    loadCategories();
  </script>
</body>
</html>
