<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫畫管理系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', '微軟正黑體', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.5em;
      border-bottom: 3px solid #667eea;
      padding-bottom: 10px;
    }

    .upload-zone {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }

    .upload-zone:hover {
      border-color: #764ba2;
      background: #f0f2ff;
    }

    .upload-zone.dragover {
      border-color: #764ba2;
      background: #e8ecff;
      transform: scale(1.02);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="file"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .preview-section {
      margin-top: 20px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .preview-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .preview-item img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-item {
      background: #f8f9ff;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      border-left: 4px solid #667eea;
    }

    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .comic-card {
      background: #f8f9ff;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      position: relative;
    }

    .comic-card:hover {
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
      transform: translateY(-3px);
    }

    .comic-thumbnail {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3em;
      overflow: hidden;
      position: relative;
    }

    .comic-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comic-info {
      padding: 15px;
    }

    .comic-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .comic-meta {
      font-size: 0.85em;
      color: #999;
      margin-bottom: 10px;
    }

    .comic-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .comic-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.85em;
      min-width: 70px;
    }

    .btn-view {
      background: #667eea;
      color: white;
    }

    .btn-view:hover {
      background: #5568d3;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
    }

    .btn-delete:hover {
      background: #ff5252;
    }

    .btn-thumbnail {
      background: #4caf50;
      color: white;
      font-size: 0.8em;
    }

    .btn-thumbnail:hover {
      background: #45a049;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 6px;
      color: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      animation: slideIn 0.3s ease;
      z-index: 1000;
    }

    .toast.success {
      background: #4caf50;
    }

    .toast.error {
      background: #f44336;
    }

    .toast.info {
      background: #2196f3;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* 縮圖管理模態框 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-content h3 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.3em;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }

    .thumbnail-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid #eee;
      transition: all 0.3s ease;
    }

    .thumbnail-item:hover {
      border-color: #667eea;
      transform: scale(1.05);
    }

    .thumbnail-item.selected {
      border-color: #4caf50;
      box-shadow: 0 0 0 2px #4caf50;
    }

    .thumbnail-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .thumbnail-item-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 5px;
      font-size: 0.8em;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px;
    }

    .close-modal {
      background: #f0f0f0;
      color: #333;
    }

    .close-modal:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 漫畫管理系統</h1>
      <p style="font-size: 1.1em; opacity: 0.9;">輕鬆管理您的漫畫收藏</p>
    </header>

    <div class="content">
      <div class="card">
        <h2>📤 上傳漫畫</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="comicName">漫畫名稱 *</label>
            <input type="text" id="comicName" name="name" placeholder="輸入漫畫名稱" required>
          </div>

          <div class="form-group">
            <label for="imageInput">選擇圖片 *</label>
            <div class="upload-zone" id="uploadZone">
              <div style="font-size: 3em; margin-bottom: 10px;">📁</div>
              <p>點擊或拖拽圖片到這裡</p>
              <p style="font-size: 0.9em; color: #999; margin-top: 5px;">支援多張圖片上傳</p>
              <input type="file" id="imageInput" name="images" multiple accept="image/*" style="display: none;">
            </div>
          </div>

          <div id="preview" class="preview-section" style="display: none;">
            <p style="color: #999; margin-bottom: 10px;">預覽圖片：</p>
            <div id="previewGrid" class="preview-grid"></div>
          </div>

          <div id="progressContainer" style="display: none;">
            <p style="color: #999; margin-bottom: 5px; font-size: 0.9em;">上傳進度：<span id="progressPercent">0</span>%</p>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-primary" id="uploadBtn">上傳</button>
            <button type="button" class="btn-secondary" id="resetBtn">清除</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>📊 統計資訊</h2>
        <div class="stats">
          <div class="stat-item">
            <div class="stat-number" id="totalComics">0</div>
            <div class="stat-label">總漫畫數</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="totalPages">0</div>
            <div class="stat-label">總頁數</div>
          </div>
        </div>
        <button class="btn-primary" id="rescanBtn" style="width: 100%; margin-top: 15px;">🔄 掃描現有漫畫</button>
        <div style="background: #fffbea; padding: 15px; border-radius: 6px; border-left: 4px solid #ffc107; margin-top: 15px;">
          <p style="color: #856404; font-size: 0.9em;">💡 提示：點擊「掃描現有漫畫」掛載 uploads 資料夾中的漫畫。</p>
        </div>        
        <div style="background: #fffbea; padding: 15px; border-radius: 6px; border-left: 4px solid #ffc107; margin-top: 15px;">
          <p style="color: #856404; font-size: 0.9em;">💡 提示：點擊漫畫的「設置縮圖」從頁面中選擇縮圖。</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📖 漫畫列表</h2>
      <div id="comicListContainer">
        <div class="empty-state">
          <div class="empty-state-icon">📚</div>
          <p>還沒有漫畫，上傳第一本吧！</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 縮圖管理模態框 -->
  <div class="modal" id="thumbnailModal">
    <div class="modal-content">
      <h3>📸 設置漫畫縮圖 - <span id="modalComicName"></span></h3>
      <p style="color: #666; margin-bottom: 15px;">選擇漫畫中的一頁作為縮圖：</p>
      <div class="thumbnail-grid" id="pageGrid"></div>
      <div class="modal-buttons">
        <button class="close-modal" onclick="closeThumbnailModal()">取消</button>
        <button class="btn-primary" id="confirmThumbnailBtn" style="display: none;" onclick="confirmThumbnail()">確認</button>
      </div>
    </div>
  </div>

  <script>
    // ============ 狀態變數 ============
    let selectedPageIndex = null;
    let currentEditingComic = null;

    // ============ 表單上傳 ============
    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const uploadZone = document.getElementById('uploadZone');
    const previewSection = document.getElementById('preview');
    const previewGrid = document.getElementById('previewGrid');
    const comicListContainer = document.getElementById('comicListContainer');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const totalComicsSpan = document.getElementById('totalComics');
    const totalPagesSpan = document.getElementById('totalPages');
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const rescanBtn = document.getElementById('rescanBtn');
    // ============ 縮圖模態框 ============
    const thumbnailModal = document.getElementById('thumbnailModal');
    const modalComicName = document.getElementById('modalComicName');
    const pageGrid = document.getElementById('pageGrid');
    const confirmThumbnailBtn = document.getElementById('confirmThumbnailBtn');

    // ============ 拖拽上傳 ============
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      imageInput.files = e.dataTransfer.files;
      updatePreview();
    });

    uploadZone.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', updatePreview);

    function updatePreview() {
      if (imageInput.files.length === 0) {
        previewSection.style.display = 'none';
        return;
      }

      previewSection.style.display = 'block';
      previewGrid.innerHTML = '';

      Array.from(imageInput.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          const img = document.createElement('img');
          img.src = e.target.result;
          div.appendChild(img);
          previewGrid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    resetBtn.addEventListener('click', () => {
      form.reset();
      previewSection.style.display = 'none';
      previewGrid.innerHTML = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const comicName = document.getElementById('comicName').value.trim();
      
      if (!comicName) {
        showToast('請輸入漫畫名稱', 'error');
        return;
      }

      if (imageInput.files.length === 0) {
        showToast('請選擇至少一張圖片', 'error');
        return;
      }

      uploadBtn.disabled = true;
      progressContainer.style.display = 'block';
      uploadBtn.textContent = '上傳中...';

      const formData = new FormData(form);
      
      try {
        const xhr = new XMLHttpRequest();
        
        xhr.upload.addEventListener('progress', (e) => {
          if (e.lengthComputable) {
            const percentComplete = (e.loaded / e.total) * 100;
            progressFill.style.width = percentComplete + '%';
            progressPercent.textContent = Math.round(percentComplete);
          }
        });

        xhr.addEventListener('load', async () => {
          if (xhr.status === 201) {
            showToast('漫畫上傳成功！', 'success');
            form.reset();
            previewSection.style.display = 'none';
            previewGrid.innerHTML = '';
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0';
            await loadComics();
          } else {
            const res = JSON.parse(xhr.responseText);
            showToast(res.message || '上傳失敗', 'error');
          }
          uploadBtn.disabled = false;
          uploadBtn.textContent = '上傳';
        });

        xhr.addEventListener('error', () => {
          showToast('上傳出錯，請重試', 'error');
          uploadBtn.disabled = false;
          uploadBtn.textContent = '上傳';
        });

        xhr.open('POST', '/uploadComic');
        xhr.send(formData);
      } catch (err) {
        console.error(err);
        showToast('上傳失敗', 'error');
        uploadBtn.disabled = false;
        uploadBtn.textContent = '上傳';
      }
    });
    
    // ============ 掃描現有漫畫 ============
    rescanBtn.addEventListener('click', rescanComics);

    async function rescanComics() {
      rescanBtn.disabled = true;
      rescanBtn.textContent = '掃描中...';

      try {
        const res = await fetch('/rescanComics', { method: 'POST' });
        const msg = await res.json();
        
        showToast(msg.message, 'success');
        await loadComics();
      } catch (err) {
        console.error(err);
        showToast('掃描失敗', 'error');
      } finally {
        rescanBtn.disabled = false;
        rescanBtn.textContent = '🔄 掃描現有漫畫';
      }
    }

    // ============ 加載漫畫列表 ============
    async function loadComics() {
      try {
        const res = await fetch('/listComics');
        const comics = await res.json();

        totalComicsSpan.textContent = comics.length;
        totalPagesSpan.textContent = comics.reduce((sum, c) => sum + c.pageCount, 0);

        if (comics.length === 0) {
          comicListContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📚</div>
              <p>還沒有漫畫，上傳第一本吧！</p>
            </div>
          `;
          return;
        }

        comicListContainer.innerHTML = '';
        const comicGrid = document.createElement('div');
        comicGrid.className = 'comic-grid';

        comics.forEach((comic) => {
          const card = document.createElement('div');
          card.className = 'comic-card';
          
          const thumbnailHtml = comic.thumbnail 
            ? `<img src="${comic.thumbnail}" alt="${escapeHtml(comic.name)}">`
            : `📖 ${comic.pageCount}頁`;

          card.innerHTML = `
            <div class="comic-thumbnail">${thumbnailHtml}</div>
            <div class="comic-info">
              <div class="comic-name">${escapeHtml(comic.name)}</div>
              <div class="comic-meta">${comic.pageCount} 頁</div>
              <div class="comic-actions">
                <button class="btn-view" onclick="viewComic('${encodeURIComponent(comic.name)}')">預覽</button>
                <button class="btn-thumbnail" onclick="openThumbnailModal('${encodeURIComponent(comic.name)}')">設置縮圖</button>
                <button class="btn-delete" onclick="deleteComic('${comic.name}')">刪除</button>
              </div>
            </div>
          `;
          comicGrid.appendChild(card);
        });

        comicListContainer.appendChild(comicGrid);
      } catch (err) {
        console.error('載入漫畫列表失敗:', err);
        comicListContainer.innerHTML = '<p style="color: #f44336;">載入失敗，請重新整理頁面。</p>';
      }
    }

    // ============ 縮圖管理 ============
    async function openThumbnailModal(encodedComicName) {
      const comicName = decodeURIComponent(encodedComicName);
      currentEditingComic = comicName;
      selectedPageIndex = null;

      modalComicName.textContent = comicName;
      confirmThumbnailBtn.style.display = 'none';

      try {
        // 獲取漫畫頁面
        const res = await fetch(`/getComic/${encodedComicName}`);
        const data = await res.json();

        pageGrid.innerHTML = '';
        data.pages.forEach((page, index) => {
          const div = document.createElement('div');
          div.className = 'thumbnail-item';
          div.innerHTML = `
            <img src="${page}" alt="第 ${index + 1} 頁">
            <div class="thumbnail-item-label">第 ${index + 1} 頁</div>
          `;
          div.addEventListener('click', () => selectPage(index, div));
          pageGrid.appendChild(div);
        });

        thumbnailModal.classList.add('active');
      } catch (err) {
        console.error(err);
        showToast('無法加載漫畫頁面', 'error');
      }
    }

    function selectPage(index, element) {
      // 移除之前的選擇
      document.querySelectorAll('.thumbnail-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      selectedPageIndex = index;
      element.classList.add('selected');
      confirmThumbnailBtn.style.display = 'block';
    }

    async function confirmThumbnail() {
      if (!currentEditingComic || selectedPageIndex === null) return;

      confirmThumbnailBtn.disabled = true;
      confirmThumbnailBtn.textContent = '處理中...';

      try {
        const res = await fetch(`/setThumbnailPage/${encodeURIComponent(currentEditingComic)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pageIndex: selectedPageIndex })
        });

        if (!res.ok) throw new Error('設置失敗');
        showToast('縮圖已更新！', 'success');

        closeThumbnailModal();
        await loadComics();
      } catch (err) {
        console.error(err);
        showToast('操作失敗', 'error');
      } finally {
        confirmThumbnailBtn.disabled = false;
        confirmThumbnailBtn.textContent = '確認';
      }
    }

    function closeThumbnailModal() {
      thumbnailModal.classList.remove('active');
      selectedPageIndex = null;
      currentEditingComic = null;
    }
    // ============ 重新掃描漫畫 ============
    async function rescanComics() {
      const res = await fetch('/rescanComics', { method: 'POST' });
      const msg = await res.json();
      alert(msg.message);
    }
    // ============ 其他功能 ============
    function viewComic(encodedName) {
      window.open(`/viewer.html?name=${encodedName}`, '_blank');
    }

    async function deleteComic(name) {
      if (!confirm(`確定要刪除漫畫 "${name}"？此操作無法撤銷。`)) {
        return;
      }

      try {
        const res = await fetch(`/deleteComic/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const msg = await res.json();
        
        if (res.ok) {
          showToast(`已刪除 "${name}"`, 'success');
          await loadComics();
        } else {
          showToast(msg.message || '刪除失敗', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('刪除出錯', 'error');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 關閉模態框（點擊外部）
    thumbnailModal.addEventListener('click', (e) => {
      if (e.target === thumbnailModal) {
        closeThumbnailModal();
      }
    });

    loadComics();
  </script>
  
  <style>
    @keyframes slideOut {
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }
  </style>
</body>
</html>
